<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LocalHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <rect width="28" height="28" rx="8" fill="#6200EE"/>
                        <path d="M8 10h12v8H8z" fill="#fff" opacity="0.9"/>
                        <path d="M10 8h8v2H10z" fill="#fff" opacity="0.6"/>
                    </svg>
                </div>
                <div>
                    <h1 class="header-title">LocalHub</h1>
                    <p class="header-sub">Local Server Dashboard</p>
                </div>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span id="statusText">Active</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- Server Info Card -->
            <div class="card card-server">
                <div class="card-label">Server Address</div>
                <div class="server-url" id="serverUrl">
                    <span class="url-text">http://localhost:8080</span>
                    <button class="btn-copy" onclick="copyUrl()" title="Copy URL">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2"/>
                            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                        </svg>
                    </button>
                </div>
                <div class="server-meta">
                    <span class="meta-tag">Port 8080</span>
                    <span class="meta-tag" id="uptimeTag">Uptime: --</span>
                </div>
            </div>

            <!-- Quick Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon stat-icon-files">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                    </div>
                    <div class="stat-value" id="fileCount">--</div>
                    <div class="stat-label">Files Served</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-icon-requests">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                        </svg>
                    </div>
                    <div class="stat-value" id="requestCount">0</div>
                    <div class="stat-label">Requests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-icon-folder">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                        </svg>
                    </div>
                    <div class="stat-value" id="folderName">--</div>
                    <div class="stat-label">Root Folder</div>
                </div>
            </div>

            <!-- File Browser -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Files</h2>
                    <button class="btn-text" onclick="refreshFiles()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
                        </svg>
                        Refresh
                    </button>
                </div>
                <div class="file-list" id="fileList">
                    <div class="file-empty">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
                            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                        </svg>
                        <p>Loading files...</p>
                    </div>
                </div>
            </div>

            <!-- Connection Info -->
            <div class="card card-info">
                <div class="info-row">
                    <span class="info-label">Connection</span>
                    <span class="info-value" id="connectionType">Local</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Protocol</span>
                    <span class="info-value">HTTP/1.1</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Server</span>
                    <span class="info-value">NanoHTTPD</span>
                </div>
            </div>
        </main>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
